# BEGIN OPEN-APPLE-CACHE (managed from cachingserver/.env)
# Client subnet checks happen here; the app records the proxy as its client.
server {
    listen 192.168.10.247:8080;
    allow 192.168.20.0/24;
    allow 192.168.30.0/24;
    allow 192.168.10.0/24;
    allow 192.168.40.0/24;
    allow 192.168.50.0/24;
    allow 192.168.60.0/24;
    allow 10.77.0.0/16;
    deny all;
    location ~ ^/_(auth|admin|cache)(/|$) { return 403; }
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_pass http://172.30.20.8:8080;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
server {
    listen 192.168.10.247:8446 ssl;
    allow 192.168.20.0/24;
    allow 192.168.30.0/24;
    allow 192.168.10.0/24;
    allow 192.168.40.0/24;
    allow 192.168.50.0/24;
    allow 192.168.60.0/24;
    allow 10.77.0.0/16;
    deny all;
    location = / { return 302 /_cache/; }
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass https://172.30.20.8:8443;
        # Match existing Portainer: private upstream with application TLS.
        proxy_ssl_verify off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
# END OPEN-APPLE-CACHE
